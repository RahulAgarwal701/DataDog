# Dev's stack. Darsan can copy these into deploy/docker-compose.yml.
x-svc: &svc
  build: {context: .., dockerfile: services/Dockerfile}
  volumes: ["logs:/logs"]
x-env: &env
  HTTP_KEEPALIVE: "false"
  ORDERS_URL: http://orders:8001
  PAYMENTS_URL: http://payments:8002
  INVENTORY_URL: http://inventory:8003
  GATEWAY_URL: http://api-gateway:8000
services:
  api-gateway: {<<: *svc, ports: ["8000:8000"], environment: {<<: *env, MODULE: api_gateway, PORT: "8000", SERVICE_NAME: api-gateway}}
  orders:      {<<: *svc, ports: ["8001:8001"], environment: {<<: *env, MODULE: orders, PORT: "8001", SERVICE_NAME: orders}}
  payments:    {<<: *svc, ports: ["8002:8002"], environment: {<<: *env, MODULE: payments, PORT: "8002", SERVICE_NAME: payments}}
  inventory:   {<<: *svc, ports: ["8003:8003"], environment: {<<: *env, MODULE: inventory, PORT: "8003", SERVICE_NAME: inventory}}
  loadgen:     {<<: *svc, ports: ["8010:8010"], depends_on: [api-gateway], environment: {<<: *env, MODULE: loadgen, PORT: "8010", SERVICE_NAME: loadgen}}
volumes: {logs: {}}
