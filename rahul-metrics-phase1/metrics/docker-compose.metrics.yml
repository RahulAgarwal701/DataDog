# Rahul slice of the stack. Darsan merges this into deploy/docker-compose.yml
# (paths are relative to metrics/; adjust context/volumes when merged).
# Standalone: docker compose -f metrics/docker-compose.metrics.yml up --build
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  metrics-api:
    build:
      context: ..                    # repo root, so the Dockerfile can COPY contracts/
      dockerfile: metrics/metrics_api/Dockerfile
    environment:
      PORT: "9001"
      LOG_LEVEL: INFO
      PROMETHEUS_URL: http://prometheus:9090
      MOCK: "false"
    ports: ["9001:9001"]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(\"http://localhost:9001/health\", timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
